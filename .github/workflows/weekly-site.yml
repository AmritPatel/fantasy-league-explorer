name: Weekly league refresh and publish
on:
  schedule:
    - cron: '37 6 * * 2,3,4'
  workflow_dispatch:
  push:
    branches: [codex/pages]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'LICENSE-Plotly.txt'
      - 'assets/**'
      - 'weekly/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/weekly-site.yml'
permissions:
  contents: read
concurrency:
  group: weekly-league-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/pages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test data and publication rules
        run: npm test
      - name: Refresh validated weekly data
        env:
          ESPN_SESSION_S2: ${{ secrets.ESPN_SESSION_S2 }}
          ESPN_SESSION_SWID: ${{ secrets.ESPN_SESSION_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
        run: npm run refresh
      - name: Preserve weekly snapshots
        id: commit
        run: |
          git add weekly
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh validated weekly league snapshot'
            git push origin HEAD:codex/pages
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: refresh
    if: ${{ always() && !cancelled() && (github.event_name == 'push' || needs.refresh.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.refresh.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - name: Build main page, weekly compatibility view and preserved snapshot
        run: npm run build
      - name: Verify main-page routes and archive links
        run: node tools/check-site.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: [build, refresh]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.refresh.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify live main URL, weekly compatibility and frozen snapshot
        env:
          PUBLIC_SITE_URL: https://amritpatel.github.io/fantasy-league-explorer/
        run: node tools/check-site.mjs --live
